# Series: the delivery article — sample application CI on main: build, scan and push the staging image that CD and promotion consume
# Pipelines-as-Code runs this PipelineRun on pushes to main (a merged request).
# A named `/test ci` command can bypass PaC event annotations. The pre-build
# guard below fails every event except a push from main before build-image
# runs; use ci-merge-request.yaml for comment-triggered validation and merge
# requests. The repository holds only
# "when to run and which parameters"; the build logic lives in the catalog.
# To retry release-candidate CI, submit a new reviewed push to main. A comment
# retry intentionally fails the pre-build guard, including on main.
# The PaC Repository for this repository (shop/apps/hello) lives in the build
# namespace (shop-build, Pod Security `baseline`), because buildah cannot run
# under the `restricted` level enforced on the workload namespaces. Onboarding
# does not create it; see "Application repository and its PaC Repository" in
# README.md for the manifest and its prerequisites.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: ci
  annotations:
    pipelinesascode.tekton.dev/on-event: "[push]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/max-keep-runs: "10"
spec:
  # Resolver-form pipelineRef with an explicit version: upgrading the build logic
  # means changing `version` here through a merge request.
  # python-image-build-scan-deploy 0.3 is used as a language-neutral "clone ->
  # build Containerfile -> scan" line: pre-build checks the trusted event;
  # SonarQube and deployment are skipped when their inputs are empty.
  # The Go compile and unit tests run inside the multi-stage
  # Containerfile.
  pipelineRef:
    resolver: hub
    params:
      - name: catalog
        value: catalog-pipelines
      - name: kind
        value: pipeline
      - name: name
        value: python-image-build-scan-deploy
      - name: version
        value: "0.3"
  params:
    - name: gitURL
      value: "{{ repo_url }}"
    - name: gitRevision
      value: "{{ revision }}"
    # Use PaC's actual Pod annotations through a read-only downward-API mount.
    # Comment arguments can override {{ event_type }} and branch variables,
    # so those template variables are not an authorization source. The
    # catalog's build-image task depends on pre-build; failures prevent push.
    - name: pythonImage
      value: registry.example.com/catalog/python:<tag>
    - name: preBuildRequirementsFile
      value: ""
    - name: preBuildScript
      value: |
        set -eu
        # python 0.2 exposes the bound workspace path in this environment
        # variable. No repository script or package is executed by this check.
        [ "${WORKSPACE_PIP_CONF_BOUND:-false}" = true ] || exit 1
        TRIGGER_DIR="$WORKSPACE_PIP_CONF_PATH"
        [ "$(cat "$TRIGGER_DIR/event-type")" = push ] \
          || { echo "Release-candidate CI requires a push event" >&2; exit 1; }
        case "$(cat "$TRIGGER_DIR/source-branch")" in main|refs/heads/main) ;; *) exit 1 ;; esac
        case "$(cat "$TRIGGER_DIR/target-branch")" in main|refs/heads/main) ;; *) exit 1 ;; esac
    # Tag the image with the commit SHA for humans; delivery never uses this
    # tag. CD and promotion take the digest that buildah reports as the
    # `IMAGE_DIGEST` result of the `build-image` task (see README.md).
    - name: images
      value:
        - "registry.example.com/shop/hello:{{ revision }}"
    - name: containerfilePath
      value: ./Containerfile
    - name: buildContext
      value: .
    # Fail the run on HIGH or CRITICAL findings only; the scan step reads the
    # image just pushed (the first entry of `images`).
    - name: trivySeverity
      value:
        - HIGH
        - CRITICAL
    - name: trivyExitCode
      value: "1"
    # Air gap: without a DB repository trivy-scanner downloads its
    # vulnerability DB from mirror.gcr.io and the run fails offline. Point it
    # at your internal mirror of mirror.gcr.io/aquasec/trivy-db:2 (placeholder
    # below, README "Replacement points"); the scan step must be able to pull
    # it (an anonymous-pull project, or one the shop-harbor credential reads).
    - name: trivyExtraArgs
      value:
        - --db-repository
        - registry.example.com/mirror/trivy-db:2
  workspaces:
    # Reuse the catalog's optional pre-build config workspace for trigger
    # metadata only. There is no pip.conf and dependency installation is off.
    # Tekton propagates PaC annotations from PipelineRun -> TaskRun -> Pod.
    - name: pip-conf
      projected:
        sources:
          - downwardAPI:
              items:
                - path: event-type
                  fieldRef:
                    fieldPath: metadata.annotations['pipelinesascode.tekton.dev/event-type']
                - path: source-branch
                  fieldRef:
                    fieldPath: metadata.annotations['pipelinesascode.tekton.dev/source-branch']
                - path: target-branch
                  fieldRef:
                    fieldPath: metadata.annotations['pipelinesascode.tekton.dev/branch']
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
    # Git credentials that PaC generates for this run (clone only).
    - name: git-basic-auth
      secret:
        secretName: "{{ git_auth_secret }}"
    # Push credentials for the project's Harbor project `shop`, provided by
    # the project-level Harbor Connector `shop-harbor` that onboarding step 3
    # (harbor-tenant, connector <project>/<project>-harbor) writes into the
    # project namespace.
    - name: registry-config
      csi:
        driver: connectors-csi
        readOnly: true
        volumeAttributes:
          connectors: shop/shop-harbor
          configuration.names: registry-config
    # CA of the Connectors proxy. registry-config routes buildah and trivy
    # through the proxy, which re-signs TLS with its own CA; this workspace
    # (mapped to buildah's cert-dir and trivy's ca-bundle) supplies that CA. It
    # is needed also for a registry with a public certificate. `!ca.cert`
    # leaves out the deprecated ca.cert alias: in a cert directory a *.cert
    # file is read as a client certificate and needs a matching key.
    - name: ca-bundle
      csi:
        driver: connectors-csi
        readOnly: true
        volumeAttributes:
          connectors: shop/shop-harbor
          configuration.names: registry-config,!ca.cert
