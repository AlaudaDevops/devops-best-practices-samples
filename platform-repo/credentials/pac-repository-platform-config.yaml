# Series: 02 §5/§7/§11 — PaC Repository of the platform repository itself, so .tekton/validate.yaml runs on every merge request
# Part of the credential layer (series 02 §5, first row: PaC credentials are
# kept per Repository namespace): it lives in the management namespace next to
# its sealed token and webhook secret (sealedsecret-platform-config-auth.yaml),
# and the platform-credentials Application renders it like every other file in
# this directory, so the repository's own registration is under GitOps too.
# The webhook is created by the PaC webhook registration controller once the
# central webhook credentials are configured (series 02 §11); those
# credentials are a manual prerequisite, not a file of this repository.
# The runs execute in platform-connectors, next to the admin Secrets and the
# onboarding ServiceAccount, and a Pod can mount any Secret of its own
# namespace. pipelinerun_provenance: default_branch therefore makes PaC read
# .tekton/ from main, so a merge request author cannot change what runs here
# before review. Moving the Repository to a namespace without admin Secrets is
# the stronger hardening (README "Operating notes and hardening").
apiVersion: pipelinesascode.tekton.dev/v1alpha1
kind: Repository
metadata:
  name: platform-config
  namespace: platform-connectors
spec:
  url: https://git.example.com/platform/platform-config
  git_provider:
    type: gitlab
    # Always set the API URL of a self-hosted GitLab: Pipelines-as-Code
    # v0.48.1 without it sends commit status and merge request comments, with
    # this Repository's token, to https://gitlab.com.
    url: https://git.example.com
    # Keys default to provider.token and webhook.secret.
    secret:
      name: platform-config-auth
    webhook_secret:
      name: platform-config-auth
  # tektoncd-operator docs/en/pac/how_to/advanced_repository_config.mdx,
  # "Changing the Source Branch for Pipeline Definition".
  settings:
    pipelinerun_provenance: "default_branch"
