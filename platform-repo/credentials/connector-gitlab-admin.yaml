# Series: 02 §5/§10 — admin-level GitLab Connector used by the onboarding pipeline
# Holds an administrator credential for GitLab. It lives in the management
# namespace; project members get no read access here and only receive the
# project-level connectors that the auto-creation tasks write.
apiVersion: connectors.alauda.io/v1alpha1
kind: Connector
metadata:
  name: gitlab-admin
  namespace: platform-connectors
spec:
  connectorClassName: gitlab
  address: https://git.example.com
  auth:
    name: patAuth
    secretRef:
      name: gitlab-admin
