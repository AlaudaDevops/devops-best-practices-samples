# Series: the platform configuration article — admin-level SonarQube Connector used by the onboarding pipeline
# Holds an administrator credential for SonarQube. It lives in the management
# namespace; project members get no read access here and only receive the
# project-level connectors that the auto-creation tasks write.
apiVersion: connectors.alauda.io/v1alpha1
kind: Connector
metadata:
  name: sonarqube-admin
  namespace: platform-connectors
spec:
  connectorClassName: sonarqube
  address: https://sonar.example.com
  auth:
    name: tokenAuth
    secretRef:
      name: sonarqube-admin
