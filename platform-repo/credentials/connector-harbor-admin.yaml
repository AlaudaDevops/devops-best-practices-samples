# Series: the platform configuration article — admin-level Harbor Connector used by the onboarding pipeline
# Holds an administrator credential for Harbor. It lives in the management
# namespace; project members get no read access here and only receive the
# project-level connectors that the auto-creation tasks write.
apiVersion: connectors.alauda.io/v1alpha1
kind: Connector
metadata:
  name: harbor-admin
  namespace: platform-connectors
spec:
  connectorClassName: harbor
  address: https://registry.example.com
  auth:
    name: basicAuth
    secretRef:
      name: harbor-admin
