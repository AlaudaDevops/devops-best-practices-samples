# Series: 02 §5/§11 — sealed access token and webhook secret for the PaC Repository of the platform repository (placeholder ciphertext)
# Generated with kubeseal; see SEALED-SECRETS.md. `provider.token` is a
# repository access token with the `api` scope (PaC reports merge request
# status with it) and `read_repository` (the scope the GitLab Connector
# documentation names for cloning over HTTPS); `webhook.secret` is a random
# string that PaC and GitLab both hold. Replace every <encrypted> value with
# the output of kubeseal against your cluster's controller.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: platform-config-auth
  namespace: platform-connectors
spec:
  encryptedData:
    provider.token: <encrypted>
    webhook.secret: <encrypted>
  template:
    metadata:
      name: platform-config-auth
      namespace: platform-connectors
    type: Opaque
