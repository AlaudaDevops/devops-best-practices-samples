# Series: 02 §5/§10 — admin-level Nexus Connector used by the onboarding pipeline
# Holds an administrator credential for Nexus. It lives in the management
# namespace; project members get no read access here and only receive the
# project-level connectors that the auto-creation tasks write.
apiVersion: connectors.alauda.io/v1alpha1
kind: Connector
metadata:
  name: nexus-admin
  namespace: platform-connectors
spec:
  connectorClassName: nexus
  address: https://nexus.example.com
  auth:
    name: basicAuth
    secretRef:
      name: nexus-admin
