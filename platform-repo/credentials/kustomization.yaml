# Series: the platform configuration article — credential layer: admin-level Connectors and the platform repository's PaC Repository in the management namespace
# Only SealedSecret objects are committed here, never a plaintext Secret
# (see SEALED-SECRETS.md). The five sealedsecret-*.yaml files hold <encrypted>
# placeholders and must be regenerated with kubeseal for your cluster.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: platform-connectors
resources:
  - sealedsecret-gitlab-admin.yaml
  - sealedsecret-harbor-admin.yaml
  - sealedsecret-nexus-admin.yaml
  - sealedsecret-sonarqube-admin.yaml
  - connector-gitlab-admin.yaml
  - connector-harbor-admin.yaml
  - connector-nexus-admin.yaml
  - connector-sonarqube-admin.yaml
  # PaC Repository of this repository (runs .tekton/validate.yaml).
  - sealedsecret-platform-config-auth.yaml
  - pac-repository-platform-config.yaml
