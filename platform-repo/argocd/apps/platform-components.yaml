# Series: the platform configuration article — component layer: TektonConfig fragments for Pruner, Results and the Chains registry credential (components/)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-components
  namespace: argocd
  annotations:
    # Diff server-side as well: with ServerSideApply alone, kinds the API
    # server or a webhook fills with defaults (Kyverno ClusterPolicy,
    # Connector, Tekton Pipeline) stay OutOfSync after every successful sync
    # and selfHeal re-syncs them in a loop.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: platform
  source:
    repoURL: https://git.example.com/platform/platform-config.git
    targetRevision: main
    path: components
  destination:
    # TektonConfig is cluster-scoped, so no destination namespace.
    name: <cluster-name>
  syncPolicy:
    automated:
      # Never prune here: removing a file from components/ must not delete the
      # singleton TektonConfig `config`, which would uninstall Tekton components.
      prune: false
      # Observe operator field ownership before enabling continuous self-heal.
      selfHeal: false
    syncOptions:
      # Server-side apply is what makes a partial TektonConfig safe: Argo CD
      # only owns the fields written in components/, the operator keeps the rest.
      - ServerSideApply=true
