# Series: 02 §5/§6/§7 — credential layer: admin-level Connectors, SealedSecrets and the PaC Repository of this repository (credentials/)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-credentials
  namespace: argocd
  annotations:
    # Diff server-side as well: with ServerSideApply alone, kinds the API
    # server or a webhook fills with defaults (Kyverno ClusterPolicy,
    # Connector, Tekton Pipeline) stay OutOfSync after every successful sync
    # and selfHeal re-syncs them in a loop.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: platform
  source:
    repoURL: https://git.example.com/platform/platform-config.git
    targetRevision: main
    path: credentials
  destination:
    name: <cluster-name>
    namespace: platform-connectors
  syncPolicy:
    automated:
      prune: true
      # selfHeal is off on purpose (series 02 §6 "reference practice"): the
      # sealed-secrets controller writes status back onto its objects, and
      # selfHeal would keep re-aligning them. This layer syncs on merge only.
      selfHeal: false
    syncOptions:
      - ServerSideApply=true
