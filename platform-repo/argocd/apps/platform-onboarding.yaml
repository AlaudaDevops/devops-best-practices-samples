# Series: 02 §7/§9 — the fifth Application: onboarding pipeline, Run Template, ScheduledTriggers and their RBAC (onboarding/)
# Copy the onboarding/ directory of this sample set to onboarding/ at the root
# of the platform repository; this Application renders it into the management
# namespace platform-connectors, next to the admin Connectors the pipeline
# mounts. Its ClusterRole and ClusterRoleBinding carry no namespace.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-onboarding
  namespace: argocd
  annotations:
    # Diff server-side as well: with ServerSideApply alone, kinds the API
    # server or a webhook fills with defaults (Kyverno ClusterPolicy,
    # Connector, Tekton Pipeline) stay OutOfSync after every successful sync
    # and selfHeal re-syncs them in a loop.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: platform
  source:
    repoURL: https://git.example.com/platform/platform-config.git
    targetRevision: main
    path: onboarding
  destination:
    name: <cluster-name>
    namespace: platform-connectors
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
