# Series: the platform configuration article — disposable GitOps self-healing probe
# No subjects are bound, so deleting this object does not remove anyone's access.
# Onboarding renders it into projects/<project>/ for the projects Application.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shop-self-healing-probe
  namespace: shop
  labels:
    app.kubernetes.io/part-of: shop
    samples.example.com/acceptance-probe: self-healing
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects: []
