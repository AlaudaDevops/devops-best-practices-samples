# Series: the delivery article / the platform configuration article — the central registry credential Tekton Chains stores signatures and attestations with
# Chains signs with the platform key (Secret signing-secrets) and stores the
# signature and the attestation beside each image, as the tags
# sha256-<digest>.sig and .att of the same repository. This fragment gives the
# Chains controller one central registry credential to push them where the
# run's identity holds no credential for the image's registry (the fallback):
# a Docker config mounted from Secret chains-registry-credential in the Chains
# namespace, with DOCKER_CONFIG pointing at its directory.
#
# Owner: the platform team. The credential is a Harbor robot account with
# pull and push on every Harbor project whose images Chains signs: <project>
# and <project>-prod of each onboarded project here. Pull is needed as well:
# Chains reads the image before it signs it. Onboarding does not change this
# robot: when a project is onboarded, add its two Harbor projects to the robot
# (platform-repo/README.md, "Onboarding on merge"). The robot can push to every
# <project>-prod outside the promotion's approval: only platform administrators
# may read Secrets or create Pods in tekton-pipelines (platform-repo/README.md,
# "Operating notes and hardening").
#
# The Secret is a credential: the platform administrator creates it before the
# first sync of this layer, it is not committed. Name the bare registry host
# in --docker-server, so the entry serves every repository of that host:
#   kubectl -n tekton-pipelines create secret docker-registry chains-registry-credential \
#     --docker-server=registry.example.com \
#     --docker-username='<chains robot>' --docker-password='<token>'
# For images in more than one registry, put one entry per registry into the
# same Docker config and create the Secret from that file instead
# (--from-file=.dockerconfigjson=<file>, --type=kubernetes.io/dockerconfigjson).
#
# Precondition on the run identities: Chains first tries the registry
# credentials of the run's ServiceAccount (`secrets` and `imagePullSecrets`).
# A credential there whose registry matches the image wins, and this central
# credential is used only when none matches. Such a credential must be able to
# push to the image's Harbor project, or must be removed from that identity. In
# this sample CI signatures are stored with the project's registry credential
# that onboarding binds to `default` in <project>-build. The promotion pushes
# to <project>-prod through the production
# registry Connector (a connectors-csi workspace), not through a Secret on the
# release identity's ServiceAccount, and Chains never uses a Connector; so
# promotion signatures in <project>-prod are stored with this central
# credential, the fallback.
#
# The operator merges the entry below into the Chains Deployment. The
# containers list under this path is written as a whole: if your TektonConfig
# already sets fields here for the container tekton-chains-controller (for
# example `resources`), repeat them in this file. A change restarts the Chains
# controller; make it while no pipeline is running.
apiVersion: operator.tekton.dev/v1alpha1
kind: TektonConfig
metadata:
  name: config
spec:
  chain:
    options:
      deployments:
        tekton-chains-controller:
          spec:
            template:
              spec:
                volumes:
                  - name: chains-registry-credential
                    secret:
                      secretName: chains-registry-credential
                      # The Secret key is .dockerconfigjson; the Docker
                      # client library reads only a file named config.json.
                      items:
                        - key: .dockerconfigjson
                          path: config.json
                containers:
                  - name: tekton-chains-controller
                    env:
                      - name: DOCKER_CONFIG
                        value: /etc/chains-registry
                    volumeMounts:
                      - name: chains-registry-credential
                        mountPath: /etc/chains-registry
                        readOnly: true
