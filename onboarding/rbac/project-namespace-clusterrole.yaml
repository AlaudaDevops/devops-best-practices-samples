# Series: the platform configuration article — permissions of the onboarding ServiceAccount inside each project namespace (steps 1–6)
# Not bound cluster-wide: step 1 creates a RoleBinding `project-onboarding` to
# this ClusterRole in every namespace it creates (<project>, <project>-<env>,
# <project>-build, <project>-cd), so the write access ends at the project's
# namespaces.
#   secrets, connectors   steps 2–5 write the project-level Connectors and their
#                         Secrets; step 3 writes image pull Secrets; step 6 the
#                         PaC Secret <project>-gitops-auth
#   serviceaccounts       step 1 creates <project>-delivery and <project>-release
#                         in <project>-cd; step 3 adds the pull Secret to `default`
#   repositories          step 6 registers the GitOps repository with PaC
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: project-onboarding-namespace
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - create
      - update
      - patch
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
    verbs:
      - get
      - create
      - update
      - patch
  - apiGroups:
      - connectors.alauda.io
    resources:
      - connectors
    verbs:
      - get
      - list
      - create
      - update
      - patch
  - apiGroups:
      - pipelinesascode.tekton.dev
    resources:
      - repositories
    verbs:
      - get
      - create
      - update
      - patch
