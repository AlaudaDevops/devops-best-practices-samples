# Series: the platform configuration article — ServiceAccount that runs every onboarding TaskRun
# The run template (../run-template/) sets it as the PipelineRun's
# taskRunTemplate.serviceAccountName. Its permissions are split by scope in the
# other files of this directory; nothing grants it cluster-wide Secret access
# through the API. It runs in platform-connectors, so every run it starts can
# mount the admin Secrets of that namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: project-onboarding
  namespace: platform-connectors
