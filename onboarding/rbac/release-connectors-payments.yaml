# Series: the platform configuration article (the delivery article) — onboarding writes the promotion Connectors of project `payments` into the management namespace (step 3)
# One file per onboarded project, added together with its ScheduledTrigger in
# ../triggers/. harbor-staging-readonly and harbor-release write the Connectors
# payments-registry-readonly and payments-prod-registry and their Secrets here.
# `create` and `list` cannot be limited by name in RBAC. `create` cannot read
# or change an existing object; `list` on Connectors returns every Connector
# object of this namespace (not their Secrets). `get`, `update` and `patch`
# are limited to the two Connectors and their Secrets. This does not keep the admin Secrets
# of this namespace from the onboarding ServiceAccount: it can still mount
# them in a PipelineRun it creates (management-namespace.yaml). The Secret
# names follow the `<connector-name>-secret` default documented by the Tasks'
# `secret` param (the verbs the Tasks call are listed under "Assumptions to
# verify" in ../README.md).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: project-onboarding-release-connectors-payments
  namespace: platform-connectors
  labels:
    samples.example.com/project: payments
rules:
  # Dispatcher waits for both objects before starting the project's run.
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - roles
      - rolebindings
    resourceNames:
      - project-onboarding-release-connectors-payments
    verbs:
      - get
  # A finally task deletes only the lock owned by its PipelineRun UID.
  - apiGroups:
      - ""
    resources:
      - configmaps
    resourceNames:
      - onboarding-payments-lock
    verbs:
      - delete
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - payments-registry-readonly-secret
      - payments-prod-registry-secret
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - connectors.alauda.io
    resources:
      - connectors
    verbs:
      - list
      - create
  - apiGroups:
      - connectors.alauda.io
    resources:
      - connectors
    resourceNames:
      - payments-registry-readonly
      - payments-prod-registry
    verbs:
      - get
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: project-onboarding-release-connectors-payments
  namespace: platform-connectors
  labels:
    samples.example.com/project: payments
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: project-onboarding-release-connectors-payments
subjects:
  - kind: ServiceAccount
    name: project-onboarding
    namespace: platform-connectors
