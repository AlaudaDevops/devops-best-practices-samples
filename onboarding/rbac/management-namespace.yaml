# Series: 02 §8/§9 — permissions of the onboarding ServiceAccount in its own (management) namespace (steps 1 and 7, merge trigger)
#   configmaps     step 1 reads the declarations (ConfigMaps project-<name>,
#                  published by the platform repository's projects/ layer) and
#                  writes ConfigMap onboarding-<project>-register with the
#                  exported platform project for step 7; the merge-triggered
#                  onboard-changed-projects Pipeline reads the declarations to
#                  wait for their Argo CD sync
#   pipelineruns   step 7 starts the gitops-repo-update PipelineRun that opens
#                  the merge request against the platform repository, then
#                  polls it until it finishes; onboard-changed-projects starts
#                  one project-onboarding PipelineRun per changed declaration
# The admin-level Connectors are covered by admin-connectors.yaml. Nothing here
# grants the Secrets API in this namespace, but that is not a boundary:
# `pipelineruns create` lets the ServiceAccount start a run whose workspaces
# mount any Secret of this namespace, because a Pod may mount every Secret of
# its own namespace without Secret RBAC. Treat this ServiceAccount as able to
# use the admin credentials (README "Operating notes and hardening").
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: project-onboarding-management
  namespace: platform-connectors
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - create
      - update
      - patch
  - apiGroups:
      - tekton.dev
    resources:
      - pipelineruns
    verbs:
      - get
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: project-onboarding-management
  namespace: platform-connectors
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: project-onboarding-management
subjects:
  - kind: ServiceAccount
    name: project-onboarding
    namespace: platform-connectors
